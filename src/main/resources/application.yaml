spring:
  application:
    name: AgroPulse
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  mvc:
    format:
      date: iso

logging:
  level:
    root: INFO
    ru.ochakovo.agropulse: INFO

app:
  reports:
    upload-dir: ${java.io.tmpdir}/agropulse/reports

agropulse:
  print:
    base-url: http://localhost:8080
    timeout-seconds: 180
    device-scale-factor: 4
    chart-device-pixel-ratio: 4
