spring:
  application:
    name: finpolicy
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    root: INFO
    ru.ochakovo.finpolicy: INFO