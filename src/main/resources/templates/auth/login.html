<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<title>Login</title>
</head>
<body>
	<div th:insert="~{fragment :: locale}"></div>
	<form th:action="@{/login}" method="post">
		<div style="color: red;" th:if="${param.error}">
			Bad credentials
		</div>
		
		<label for="username"> <span th:text="#{login.username}"></span>
			<input id="username" name="username" type="email">
		</label><br>
		<label for="password"> <span th:text="#{login.password}"></span>
			<input id="password" name="password" type="password">
		</label><br>
		<button type="submit">Login</button>
	</form>
	
	<form action="/users/registration">
		<button type="submit">Registration</button>
	</form>
</body>
</html>
