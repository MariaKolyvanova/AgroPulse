<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<title>Registration</title>
</head>
<body>
	<form method="post" th:action="@{/users}" th:object="${user}">
		<label for="lastName"> Фамилия:
			<input id="lastName" name="lastName" th:value="*{lastName()}" type="text">
		</label><br>
		<label for="firstName"> Имя:
			<input id="firstName" name="firstName" th:value="*{firstName()}" type="text">
		</label><br>
		<label for="patronymic"> Отчество:
			<input id="patronymic" name="patronymic" th:value="*{patronymic()}" type="text">
		</label><br>
		<label for="username"> Почта:
			<input id="username" name="username" th:value="*{username}" type="email">
		</label><br>
		<label for="password"> Пароль:
			<input id="password" name="password" type="password">
		</label><br>
		<div th:each="role : ${roles}">
			<input name="role" th:checked="${role == user.role}" th:id="${role}" th:value="${role}" type="radio">
			<label th:for="${role}" th:text="${role}">Role name</label>
		</div>
		<button type="submit">Register</button>
	</form>
	
	<div th:if="${errors}">
		<p style="color: red" th:each="error : ${errors}" th:text="${error.defaultMessage}">Error message</p>
	</div>
</body>
</html>
