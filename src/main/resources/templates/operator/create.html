<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Создание отчёта</title>
	<link rel="icon" type="image/svg+xml" href="/images/icon.svg">
	<link rel="alternate icon" href="/images/icon.ico">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/menu.css}">
	<link rel="stylesheet" th:href="@{/css/create.css}">
	<script defer th:src="@{/js/script.js}"></script>
</head>
<body>
	<section class="menu" th:insert="~{menu :: menu}"></section>
	<main class="content">
		<h1 class="name">Создание отчёта</h1>

		<section class="create">
			<form class="create section" th:action="@{/operator/create}" method="post" enctype="multipart/form-data">
				<div class="block drop-zone">
					<div id="createDropPane" class="grid">
						<img src="/images/upload.svg" class="create" alt="">
						<p class="drop-zone-title">Перетащите xml-файл сюда</p>
						<p class="drop-zone-or">или</p>
						<label class="button file" for="fileInput">Выбрать xml-файл</label>
						<input id="fileInput" name="file" type="file" accept=".xml,application/xml,text/xml" required>
					</div>

					<div id="createLoadedPane" class="grid created create-pane--loaded" hidden>
						<img src="/images/uploaded.svg" class="create created" alt="">
						<p id="createdFileLabel" class="drop-zone-title">Файл</p>
					</div>
				</div>

				<section class="create-panel block">
					<h2 class="create">Параметры отчёта</h2>

					<div class="form-group">
						<label class="form-text" for="reportName">Название отчёта</label>
						<input id="reportName"
						       class="form"
							   name="reportName"
							   type="text"
							   placeholder="введите название отчёта"
							   th:value="${report != null} ? ${report.reportName()} : ''"
							   required>
					</div>

					<div class="form-group">
						<label class="form-text">Период данных</label>
						<div class="period-grid">
							<select class="period placeholder" id="reportMonth" name="reportMonth" required>
								<option value="" th:selected="${report == null || report.reportMonth() == null}">месяц</option>
								<option th:each="m : ${T(ru.ochakovo.agropulse.entity.data.Month).values()}"
								        th:value="${m}"
								        th:text="${m.getName()}"
								        th:selected="${report != null && report.reportMonth() == m}">
								</option>
							</select>

							<select class="period placeholder" id="reportYear" name="reportYear" required>
								<option value="" th:selected="${report == null || report.reportYear() == null}">год</option>
								<option th:each="year : ${#numbers.sequence(2022, 2035)}"
										th:value="${year}"
										th:text="${year}"
										th:selected="${report != null && report.reportYear() != null && report.reportYear() == year}"></option>
							</select>
						</div>
					</div>

					<div class="form-messages" th:if="${createError != null or successMessage != null}">
						<p class="error-message" th:if="${createError != null}" th:text="${createError}"></p>
						<p class="success-message" th:if="${successMessage != null}" th:text="${successMessage}"></p>
					</div>

					<button class="create button" type="submit">Загрузить</button>
				</section>
			</form>
		</section>
	</main>
</body>
</html>
