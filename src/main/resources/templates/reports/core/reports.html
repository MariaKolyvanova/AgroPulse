<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Отчёты</title>
	<link rel="icon" type="image/svg+xml" href="/images/icon.svg">
	<link rel="alternate icon" href="/images/icon.ico">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/menu.css}">
	<link rel="stylesheet" th:href="@{/css/audit.css}">
</head>
<body>
	<section class="menu" th:insert="~{fragments/menu :: menu}"></section>
	<main class="content">
		
		<h1 class="name">Отчёты</h1>
		
		<section class="reports">
			<form th:action="@{/reports}">
				<div class="filter">
					<input class="filter nameReport" name="reportName" placeholder="Отчёт"
					       list="reportNameOptions"
					       th:value="${reportFilter.reportName()}"
					       type="text">
					<datalist id="reportNameOptions">
						<option th:each="name : ${reportNames}" th:value="${name}"></option>
					</datalist>
					<input class="filter status" name="status" placeholder="Статус"
					       list="statusOptions"
					       th:value="${reportFilter.status()}"
					       type="text">
					<datalist id="statusOptions">
						<option th:each="status : ${statuses}" th:value="${status.label}"></option>
					</datalist>
					<select class="filter date month placeholder" name="month">
						<option value="" th:selected="${reportFilter.month() == null}">Месяц</option>
						<option th:each="m : ${T(ru.ochakovo.agropulse.entity.data.Month).values()}"
						        th:value="${m}"
						        th:text="${m.getName()}"
						        th:selected="${reportFilter.month() == m}">
						</option>
					</select>
					<input class="filter date year" name="year"
					       placeholder="Год"
					       th:value="${reportFilter.year()}"
					       type="number">
					<button class="button pageable" type="submit">Найти</button>
				</div>
				
				<div class="pageable">
					
					<div class="size">
						Показать
						<select class="size placeholder" name="size" onchange="this.form.submit()">
							<option th:selected="${reports.metadata.size == 20}" th:value="20">20
							</option>
							<option th:selected="${reports.metadata.size == 40}" th:value="40">40
							</option>
							<option th:selected="${reports.metadata.size == 80}" th:value="80">80
							</option>
						</select>
						элементов
					</div>
					
					<div class="page">
						Страница:
						<select class="page" name="page" onchange="this.form.submit()">
							<option th:each="i : ${#numbers.sequence(0, reports.metadata.totalPages - 1)}"
							        th:selected="${i == reports.metadata.page}"
							        th:text="${i + 1}"
							        th:value="${i}">
							</option>
						</select>
						
						из
						<span th:text="${reports.metadata.totalPages}">25</span>
					</div>
				
				</div>
				
				<table class="audit">
					<thead>
					<tr>
						<th class="column-3">Название отчёта</th>
						<th class="column-3">Статус</th>
						<th class="column-3">Пероид</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="report : ${reports.content}">
						<td>
							<a class="link"
							   th:href="@{'/reports/' + ${report.id()}}"
							   th:text="${report.reportName()}">Очет</a>
						</td>
						<td th:text="${report.status().label}"></td>
						<td
								th:text="${report.reportMonth() != null ? report.reportMonth().getName() + ' ' + report.reportYear() : report.reportYear()}"></td>
						
					</tr>
					</tbody>
				</table>
				
				<div class="shown">
					Показано
					<span
							th:text="${reports.metadata.totalElements == 0 ? 0 : (reports.metadata.page * reports.metadata.size + 1)}"></span>
					–
					<span th:text="${reports.metadata.totalElements == 0 ? 0 :
						    (((reports.metadata.page + 1) * reports.metadata.size) > reports.metadata.totalElements
						        ? reports.metadata.totalElements
						        : ((reports.metadata.page + 1) * reports.metadata.size))}">
						</span>
					из
					<span th:text="${reports.metadata.totalElements}"></span>
				</div>
			
			</form>
		</section>
	</main>
</body>
</html>
